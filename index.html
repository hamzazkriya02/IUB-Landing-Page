<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4fbff" />
  <title>IUB Dashboard — Final Layout</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Original corner actions: only color changed to blue -->
  <button class="corner-btn left top-corner" id="todoBtn">ToDo List</button>
  <button class="corner-btn right top-corner" id="googleBtn">Google Maps</button>

  <header>
    <div class="header-row">
      <img src="assets/iub-logo.png" alt="IUB Logo" class="logo" />
      <h1>The Islamia University of Bahawalpur</h1>
    </div>
  </header>

  <main class="main">
    <section class="left-section">
      <div class="time-row" aria-label="Current time">
        <div class="time-box" id="hours">00</div>
        <div class="time-box" id="minutes">00</div>
        <div class="time-box" id="seconds">00</div>
      </div>

      <div class="date-box" id="date">Tuesday, 31 December 2024</div>

      <div class="weather-row">
        <div class="weather-item">
          <i class="fa-solid fa-temperature-three-quarters"></i>
          <span id="tempVal">30°C</span>
        </div>
        <div class="weather-item">
          <i class="fa-solid fa-location-dot"></i>
          <span>Bahawalpur</span>
        </div>
      </div>

      <div class="divider"><span>IUB Help Centre</span></div>

      <div class="help-row">
        <div class="help-card" id="liveChat" role="button" tabindex="0">
          <img src="assets/live_chat.svg" alt="Live Chat" />
          <p>Live Chat</p>
        </div>

        <div class="help-card" id="announcement" role="button" tabindex="0">
          <img src="assets/announcements.svg" alt="Announcements" />
          <p>Announcements</p>
        </div>

        <div class="help-card" id="contact" role="button" tabindex="0">
          <img src="assets/phone_email.svg" alt="Contact" />
          <p>Contact No#</p>
        </div>
      </div>
    </section>

    <section class="right-section">
      <div class="top-buttons">
        <button class="portal-btn" id="myiubBtn">My IUB</button>
        <button class="portal-btn" id="eportalBtn">E-Portal</button>
        <button class="portal-btn" id="lmsBtn">LMS</button>
      </div>

      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search anything here..." aria-label="Google search" />
        <button id="voiceBtn" aria-label="Voice search"><i class="fa-solid fa-microphone"></i></button>
        <button id="searchBtn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>

      <div class="carousel-container">
        <button class="carrow" id="prev" aria-label="Previous slide">‹</button>
        <img id="slide" src="assets/fee_structure_ads.jpg" alt="IUB information slide" />
        <button class="carrow" id="next" aria-label="Next slide">›</button>
      </div>
    </section>
  </main>

  <footer>
    <button class="corner-btn left footer-btn" id="aiBtn">AI Tools</button>

    <div class="social-footer">
      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><i class="fa-brands fa-facebook social-icon"></i></a>
      <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" aria-label="Twitter"><i class="fa-brands fa-twitter social-icon"></i></a>
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fa-brands fa-instagram social-icon"></i></a>
      <a href="mailto:info@iub.edu.pk" aria-label="Email"><i class="fa-solid fa-envelope social-icon"></i></a>
      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><i class="fa-brands fa-youtube social-icon"></i></a>
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa-brands fa-linkedin social-icon"></i></a>
    </div>

    <button class="corner-btn right footer-btn" id="bookmarkBtn">Bookmarks</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
